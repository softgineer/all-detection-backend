# render.yaml  –  Deploy backend to Render.com (free tier)
services:
  - type: web
    name: all-detection-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: models
      mountPath: /app/models
      sizeGB: 1
